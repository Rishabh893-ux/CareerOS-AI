name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's free tier from sleeping (which happens after 15 mins of inactivity)
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: curl -sSf https://careeros-backend-k7r1.onrender.com/ || echo "Failed to ping"
